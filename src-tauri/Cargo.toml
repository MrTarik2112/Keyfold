[package]
name = "keyfold"
version = "0.1.0"
description = "Keyfold - a local-first, offline, encrypted vault for API keys"
authors = ["Keyfold"]
license = "MIT"
edition = "2021"
rust-version = "1.77"
default-run = "keyfold"

[lib]
name = "keyfold_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
thiserror = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
subtle = "2.6"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
hex-literal = "1"
tauri = { version = "2", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# overflow checks abort instead of wrapping in the shipped build
overflow-checks = true
strip = true
